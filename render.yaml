services:
  - type: web
    name: urban-air-quality-assistant
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20.19.3"
      - key: NODE_ENV
        value: production
